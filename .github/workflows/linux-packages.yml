name: Publish Linux distribution packages
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned packaging tool
        shell: bash
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/nfpm.tar.gz"
          cd "$RUNNER_TEMP"
          echo '2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7  nfpm.tar.gz' | sha256sum -c -
          tar xf nfpm.tar.gz nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Package verified release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p binaries packages
          gh release download "$TAG" -D binaries -p SHA256SUMS -p 'hfdx-linux-*' -p 'hfdx-gui-linux-*'
          (cd binaries && sha256sum --ignore-missing -c SHA256SUMS)
          for cpu in x86_64 aarch64; do
            packaging/linux.sh "${TAG#v}" "$cpu" binaries packages
          done
          (cd packages && sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS.native)
          gh release upload "$TAG" packages/*
