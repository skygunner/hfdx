[package]
name = "hfdx-core"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
globset = "0.4"
dirs = "6"
tempfile = "3"
fs2 = "0.4"
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
flexi_logger = { version = "0.31.10", default-features = false }
sys-locale = "0.3"
self-replace = "1.5.1"
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem"] }

[build-dependencies]
sha2 = "0.10"
