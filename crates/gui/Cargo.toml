[package]
name = "hfdx-gui"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
hfdx-core = { path = "../core" }
rfd = { version = "=0.16.1", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-x11", "backend-winit-wayland", "renderer-software", "accessibility", "compat-1-18"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.27.0"
